name: Build Manga Yomi APK

on:
  push:
    paths:
      - 'MangaYomiAndroid-Starter.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f MangaYomiAndroid-Starter.zip
          unzip -o MangaYomiAndroid-Starter.zip -d .
          test -f MangaYomiAndroid/settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MangaYomiAndroid
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manga-Yomi-debug-APK
          path: MangaYomiAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
